<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harry Potter Imposter Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-black text-white flex items-center justify-center p-6">
  <div class="w-full max-w-xl bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl p-8 border border-white/20">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold mb-2">⚡ Harry Potter Imposter ⚡</h1>
      <p class="text-purple-200">
        3 players get the same Harry Potter word. 1 player is the imposter.
      </p>
    </div>

    <div id="game"></div>
  </div>

  <script>
    const players = ["Dominik", "Andrew", "Katrin", "Thilo"];

    const categories = {
      girls: [
        ["Hermione Granger", "Ginny Weasley", "Luna Lovegood", "Bellatrix Lestrange"],
        ["Hermione Granger", "Professor McGonagall", "Lily Potter", "Ginny Weasley"],
        ["Luna Lovegood", "Ginny Weasley", "Hermione Granger", "Moaning Myrtle"]
      ],
      boys: [
        ["Harry Potter", "Ron Weasley", "Draco Malfoy", "Neville Longbottom"],
        ["Dumbledore", "Hagrid", "Snape", "Voldemort"],
        ["Sirius Black", "Harry Potter", "Ron Weasley", "Draco Malfoy"]
      ],
      creatures: [
        ["Dementor", "Dragon", "Phoenix", "Basilisk"],
        ["House Elf", "Hippogriff", "Werewolf", "Goblin"],
        ["Dragon", "Dementor", "Phoenix", "Acromantula"]
      ],
      places: [
        ["Hogwarts", "Diagon Alley", "Hogsmeade", "Azkaban"],
        ["Platform 9¾", "Forbidden Forest", "Chamber of Secrets", "Ministry of Magic"],
        ["Hogwarts Express", "Great Hall", "Quidditch Pitch", "Azkaban"]
      ],
      spells: [
        ["Expelliarmus", "Lumos", "Expecto Patronum", "Avada Kedavra"],
        ["Wingardium Leviosa", "Alohomora", "Stupefy", "Crucio"],
        ["Sectumsempra", "Protego", "Obliviate", "Imperio"]
      ]
    };

    let gameStarted = false;
    let assignments = [];
    let currentPlayerIndex = 0;
    let showWord = false;

    function shuffle(array) {
      const arr = [...array];

      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr;
    }

    function startNewGame() {
      const categoryKeys = Object.keys(categories);

      const randomCategory =
        categoryKeys[Math.floor(Math.random() * categoryKeys.length)];

      const wordSet =
        categories[randomCategory][
          Math.floor(Math.random() * categories[randomCategory].length)
        ];

      const shuffledWords = shuffle(wordSet);

      const commonWord = shuffledWords[0];
      const imposterWord = shuffledWords[1];

      const imposterIndex = Math.floor(Math.random() * players.length);

      const playerAssignments = players.map((player, index) => ({
        player,
        word: index === imposterIndex ? imposterWord : commonWord,
        isImposter: index === imposterIndex
      }));

      assignments = shuffle(playerAssignments);
      currentPlayerIndex = 0;
      showWord = false;
      gameStarted = true;

      render();
    }

    function nextPlayer() {
      showWord = false;

      if (currentPlayerIndex < assignments.length - 1) {
        currentPlayerIndex++;
      } else {
        currentPlayerIndex = assignments.length;
      }

      render();
    }

    function resetGame() {
      gameStarted = false;
      assignments = [];
      currentPlayerIndex = 0;
      showWord = false;

      render();
    }

    function revealWord() {
      showWord = true;
      render();
    }

    function render() {
      const game = document.getElementById("game");

      if (!gameStarted) {
        game.innerHTML = `
          <div class="text-center space-y-6">
            <div class="bg-black/20 rounded-2xl p-5 text-left">
              <h2 class="text-xl font-semibold mb-3">How to Play</h2>
              <ul class="space-y-2 text-purple-100">
                <li>• Each player secretly views their word.</li>
                <li>• Three players have the SAME word.</li>
                <li>• One player has a different word.</li>
                <li>• Describe your word without saying it directly.</li>
                <li>• Try to discover who the imposter is.</li>
              </ul>
            </div>

            <button
              onclick="startNewGame()"
              class="bg-purple-600 hover:bg-purple-500 transition-all px-8 py-4 rounded-2xl text-xl font-bold shadow-lg"
            >
              Start New Game
            </button>
          </div>
        `;

        return;
      }

      if (currentPlayerIndex < assignments.length) {
        const current = assignments[currentPlayerIndex];

        game.innerHTML = `
          <div class="text-center space-y-6">
            <div>
              <p class="text-purple-300 mb-2">Pass the device to</p>
              <h2 class="text-5xl font-bold">${current.player}</h2>
            </div>

            ${!showWord ? `
              <button
                onclick="revealWord()"
                class="bg-indigo-600 hover:bg-indigo-500 transition-all px-8 py-4 rounded-2xl text-2xl font-bold shadow-lg"
              >
                Reveal My Word
              </button>
            ` : `
              <div class="space-y-6">
                <div class="bg-black/30 rounded-3xl p-8 border border-purple-400/30">
                  <p class="text-purple-300 mb-3 text-lg">Your secret word is:</p>

                  <h3 class="text-4xl font-extrabold mb-4 break-words">
                    ${current.word}
                  </h3>

                  <div class="inline-block px-4 py-2 rounded-full text-sm font-bold ${
                    current.isImposter
                      ? "bg-red-500/20 text-red-300 border border-red-400/30"
                      : "bg-green-500/20 text-green-300 border border-green-400/30"
                  }">
                    ${
                      current.isImposter
                        ? "⚠ YOU ARE THE IMPOSTER"
                        : "✅ You are NOT the imposter"
                    }
                  </div>
                </div>

                <button
                  onclick="nextPlayer()"
                  class="bg-purple-600 hover:bg-purple-500 transition-all px-8 py-4 rounded-2xl text-xl font-bold shadow-lg"
                >
                  ${
                    currentPlayerIndex === assignments.length - 1
                      ? "Start Discussion"
                      : "Next Player"
                  }
                </button>
              </div>
            `}
          </div>
        `;

        return;
      }

      game.innerHTML = `
        <div class="text-center space-y-6">
          <div class="bg-black/20 rounded-3xl p-8">
            <h2 class="text-4xl font-bold mb-4">🕵️ Everyone Has Their Word!</h2>

            <p class="text-xl text-purple-200">
              Start discussing and figure out who the imposter is.
            </p>
          </div>

          <div class="flex gap-4 justify-center flex-wrap">
            <button
              onclick="startNewGame()"
              class="bg-green-600 hover:bg-green-500 transition-all px-8 py-4 rounded-2xl text-xl font-bold shadow-lg"
            >
              Play Again
            </button>

            <button
              onclick="resetGame()"
              class="bg-gray-700 hover:bg-gray-600 transition-all px-8 py-4 rounded-2xl text-xl font-bold shadow-lg"
            >
              Reset
            </button>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
